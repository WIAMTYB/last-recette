# Active only while `mvn -Pnative native:compile` runs Spring AOT processing, which
# refreshes the context at build time. Supplies the placeholders that have no default
# so the build machine needs no real environment; never used at runtime.
ORACLE_JDBC_URL=jdbc:oracle:thin:@localhost:1521/BUILD
ORACLE_DB_USERNAME=build
ORACLE_DB_PASSWORD=build

CLIENTS_API_TITRES_BASE_URL=http://localhost/build/api-titres
CLIENTS_API_TITRES_API_KEY=build

# JMX is not supported in a native image.
spring.jmx.enabled=false
server.tomcat.mbeanregistry.enabled=false
spring.datasource.hikari.register-mbeans=false
spring.application.admin.enabled=false
management.endpoints.jmx.exposure.exclude=*
IS_OPENAPIDOC_ENABLED=true
IS_SWAGGER_ENABLED=true
