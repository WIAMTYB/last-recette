spring.config.import=optional:file:.env[.properties]
spring.application.name=epargne-programmee

server.port=${APP_PORT:8080}

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=${DB_POOL_NAME:epargneOraclePool}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:16}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME:300000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_THRESHOLD:0}
spring.datasource.hikari.auto-commit=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.default_schema=${ORACLE_DB_SCHEMA:EPARGNE}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.group.readiness.exclude=diskSpace
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.structured.format.console=ecs

############## API token security
security.api-token.header-name=X-Api-Key
security.api-token.cache-ttl=${API_TOKEN_CACHE_TTL:PT60S}

############## Documentation openapi and swagger-ui
springdoc.api-docs.enabled=${IS_OPENAPIDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${IS_SWAGGER_ENABLED:false}

plans.scheduler.cron=${PLANS_SCHEDULER_CRON:0 0 18 * * *}
plans.scheduler.zone=${PLANS_SCHEDULER_ZONE:Africa/Casablanca}
plans.scheduler.batch-size=${PLANS_SCHEDULER_BATCH_SIZE:25}
plans.scheduler.stale-run-after=${PLANS_SCHEDULER_STALE_RUN_AFTER:PT1H}

clients.api-titres.base-url=${CLIENTS_API_TITRES_BASE_URL}
clients.api-titres.api-key=${CLIENTS_API_TITRES_API_KEY}
clients.api-titres.connect-timeout=${CLIENTS_API_TITRES_CONNECT_TIMEOUT:10s}
clients.api-titres.read-timeout=${CLIENTS_API_TITRES_READ_TIMEOUT:30s}
clients.api-titres.max-calls-per-minute=${CLIENTS_API_TITRES_MAX_CALLS_PER_MINUTE:0}
clients.api-titres.rate-limit-timeout=${CLIENTS_API_TITRES_RATE_LIMIT_TIMEOUT:0s}
clients.api-titres.balance-check-enabled=${CLIENTS_API_TITRES_BALANCE_CHECK_ENABLED:false}
clients.api-titres.balance-caller=${CLIENTS_API_TITRES_BALANCE_CALLER:EPG}
